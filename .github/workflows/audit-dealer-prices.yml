name: Audit Dealer Prices (Read Only)

on:
  workflow_dispatch:
    inputs:
      run_start:
        description: "Optional ISO timestamp used to reproduce a sample"
        required: false
        type: string
      origin_sha:
        description: "Optional source SHA used to reproduce a sample"
        required: false
        type: string
      sample_gzip_base64:
        description: "Optional gzip+base64 prior 100-SKU audit artifact"
        required: false
        type: string
      sample_sha256:
        description: "Required SHA-256 when an exact sample payload is supplied"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: arcteryx-readonly-price-audit
  cancel-in-progress: false

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  audit-dealer-prices:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AUDIT_INDEPENDENT_READ_DELAY_SECONDS: "15"
      AUDIT_TRANSIENT_RETRY_ATTEMPTS: "1"
      AUDIT_TRANSIENT_RETRY_DELAY_SECONDS: "8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install read-only audit runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python tools/fetch_camoufox.py

      - name: Enforce read-only credential boundary
        run: |
          test -z "${SUPABASE_KEY:-}"
          test -z "${SUPABASE_SERVICE_ROLE_KEY:-}"
          echo "No Supabase write credential is present."

      - name: Materialize hash-bound exact sample
        if: ${{ inputs.sample_gzip_base64 != '' || inputs.sample_sha256 != '' }}
        env:
          PRICE_AUDIT_SAMPLE_GZIP_BASE64: ${{ inputs.sample_gzip_base64 }}
          REQUESTED_SAMPLE_SHA256: ${{ inputs.sample_sha256 }}
        run: |
          test -n "$PRICE_AUDIT_SAMPLE_GZIP_BASE64"
          test -n "$REQUESTED_SAMPLE_SHA256"
          python tools/prepare_price_audit_sample.py \
            --expected-sha256 "$REQUESTED_SAMPLE_SHA256" \
            --output artifacts/source-sample.json

      - id: audit
        name: Run official 100-SKU double-read audit
        continue-on-error: true
        env:
          REQUESTED_RUN_START: ${{ inputs.run_start }}
          REQUESTED_ORIGIN_SHA: ${{ inputs.origin_sha }}
        run: |
          args=(--output artifacts/price-audit.json)
          if [ -f artifacts/source-sample.json ]; then
            args+=(--sample-file artifacts/source-sample.json)
          fi
          if [ -n "$REQUESTED_RUN_START" ]; then
            args+=(--run-start "$REQUESTED_RUN_START")
          fi
          if [ -n "$REQUESTED_ORIGIN_SHA" ]; then
            args+=(--origin-sha "$REQUESTED_ORIGIN_SHA")
          fi
          python -u tools/audit_price_accuracy.py "${args[@]}"

      - name: Upload non-sensitive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dealer-price-audit-${{ github.run_id }}
          path: artifacts/price-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Enforce price audit gate
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ "$AUDIT_OUTCOME" != "success" ]; then
            echo "Read-only official price audit did not pass."
            exit 1
          fi
          echo "Read-only official price audit passed."
