name: Refresh Dealer Data

on:
  schedule:
    - cron: "50 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when the primary node is healthy"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arcteryx-production-refresh-writes
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
  INDEXNOW_KEY_LOCATION: ${{ secrets.INDEXNOW_KEY_LOCATION }}
  SITE_URL: https://geardrop.100app.dev
  REI_ENRICH_DETAILS: "true"
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  lease-gate:
    runs-on: ubuntu-latest
    outputs:
      acquired: ${{ steps.lease.outputs.acquired }}
      owner: ${{ steps.lease.outputs.owner }}
      lease_owned: ${{ steps.lease.outputs.lease_owned }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'requests>=2.32,<3'
      - id: lease
        name: Claim Dealers fallback lease when needed
        env:
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          owner="github-actions-dealers-${GITHUB_RUN_ID}"
          should_run="$FORCE_RUN"
          lease_owned=false
          if [ "$should_run" != "true" ]; then
            should_run=$(python tools/crawler_lease.py needs-fallback --scope dealers --stale-hours 4.5)
          fi
          acquired=false
          if [ "$should_run" = "true" ]; then
            if [ "$FORCE_RUN" = "true" ]; then
              acquired=true
            else
              acquired=$(python tools/crawler_lease.py acquire --scope dealers --owner "$owner" --ttl-minutes 180)
              if [ "$acquired" = "true" ]; then
                lease_owned=true
              fi
            fi
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "acquired=$acquired" >> "$GITHUB_OUTPUT"
          echo "lease_owned=$lease_owned" >> "$GITHUB_OUTPUT"

  refresh-dealers:
    needs: lease-gate
    if: needs.lease-gate.outputs.acquired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        timeout-minutes: 20
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Playwright Chromium runtime
        timeout-minutes: 20
        run: python -m playwright install --with-deps chromium

      - name: Install Camoufox browser runtime
        timeout-minutes: 20
        run: python tools/fetch_camoufox.py

      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

      - name: Verify product-name source contract
        run: |
          python tools/sync_arcteryx_names.py --check
          node --test tests/test_product_names.js

      - name: Hydrate current production dealer seed
        run: python tools/hydrate_runtime_snapshot.py --site-url "$SITE_URL" --dataset dealers --output dealers/results.json

      - name: Refresh dealer scrape and sync
        run: |
          python tools/retire_dealer.py --dealer ssense
          mkdir -p dealers/_partial
          rm -f dealers/_partial/*.json
          failed_dealers=""
          for dealer in burton backcountry evo rei; do
            echo "[dealers] $dealer"
            dealer_timeout=1800
            # EVO retries and complete REI PDP enrichment can exceed 30 minutes.
            if [ "$dealer" = "evo" ] || [ "$dealer" = "rei" ]; then
              dealer_timeout=3600
            fi
            if ! timeout "$dealer_timeout" python -u -m "dealers.$dealer"; then
              echo "[dealers] $dealer FAILED"
              failed_dealers="$failed_dealers $dealer"
            fi
          done
          # 发布成功抓到的 dealer。merge_partial 用上一轮 results.json 播种，失败的
          # dealer 保留上次数据；supabase_sync 对缺失 dealer 直接跳过（14 天 stale
          # buffer 兜底，不删存量行）。不再因单个 dealer 失败就整体拒绝发布。
          python -m dealers.merge_partial
          python -u -m dealers.supabase_sync
          echo "SYNC_COMPLETED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          if [ -n "$failed_dealers" ]; then
            echo "::warning::dealer scrape failed for:$failed_dealers — 已发布其余 dealer；下面的每 dealer 新鲜度门决定 build 状态"
          fi
          # 真正的守门员：每个 dealer 必须存在且最新数据 <=36h（REI 失败 >36h 才让 build 红）。
          python tools/check_data_quality.py --online --dealer burton --dealer backcountry --dealer evo --dealer rei --max-age-hours 36 --max-product-age-hours 72 --min-rows 50
          node tools/audit_product_names.mjs --online --strict-source

      - name: Optional price alerts
        run: python check_price_alerts.py || echo "price alerts check failed"

      - name: Verify production freshness
        run: |
          python tools/wait_for_data_release.py --site-url "$SITE_URL" --after "$SYNC_COMPLETED_AT" --timeout-seconds 1800 --interval-seconds 10
          python tools/check_data_quality.py --online --dealer burton --dealer backcountry --dealer evo --dealer rei --max-age-hours 36 --max-product-age-hours 72 --min-rows 50
          node tools/audit_product_names.mjs --online --strict-source
          curl -fsS "$SITE_URL/dealers/results.json" | python -c 'import json,sys; data=json.load(sys.stdin); print("generated_at", data.get("generated_at")); print({k:v.get("count") for k,v in data.get("dealers",{}).items()})'
          python tools/notify_indexnow.py --sitemap-url "$SITE_URL/sitemap-products.xml" --sitemap-url "$SITE_URL/sitemap-deals.xml" --sitemap-url "$SITE_URL/sitemap-insights.xml" --since-days 2 || echo "::warning::IndexNow notification failed or is not configured"

      - name: Release Dealers lease
        if: always() && needs.lease-gate.outputs.lease_owned == 'true'
        env:
          LEASE_OWNER: ${{ needs.lease-gate.outputs.owner }}
          JOB_STATUS: ${{ job.status }}
        run: |
          status=failed
          [ "$JOB_STATUS" = "success" ] && status=success
          python tools/crawler_lease.py finish --scope dealers --owner "$LEASE_OWNER" --status "$status" --message "GitHub Actions run ${GITHUB_RUN_ID}: $JOB_STATUS"
