name: Refresh MEC Data

on:
  schedule:
    # OCI MEC starts at :00 on these hours. Check 20 minutes later.
    - cron: "20 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when the OCI primary is healthy"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arcteryx-production-refresh-writes
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
  INDEXNOW_KEY_LOCATION: ${{ secrets.INDEXNOW_KEY_LOCATION }}
  GITHUB_TOKEN: ${{ github.token }}
  SITE_URL: https://geardrop.100app.dev

jobs:
  lease-gate:
    runs-on: ubuntu-latest
    outputs:
      acquired: ${{ steps.lease.outputs.acquired }}
      owner: ${{ steps.lease.outputs.owner }}
      lease_owned: ${{ steps.lease.outputs.lease_owned }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'requests>=2.32,<3'
      - id: lease
        name: Claim MEC fallback lease when needed
        env:
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          owner="github-actions-mec-${GITHUB_RUN_ID}"
          should_run="$FORCE_RUN"
          lease_owned=false
          if [ "$should_run" != "true" ]; then
            should_run=$(python tools/crawler_lease.py needs-fallback --scope mec --stale-hours 3.1)
          fi
          acquired=false
          if [ "$should_run" = "true" ]; then
            if [ "$FORCE_RUN" = "true" ]; then
              acquired=true
            else
              acquired=$(python tools/crawler_lease.py acquire --scope mec --owner "$owner" --ttl-minutes 90)
              if [ "$acquired" = "true" ]; then
                lease_owned=true
              fi
            fi
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "acquired=$acquired" >> "$GITHUB_OUTPUT"
          echo "lease_owned=$lease_owned" >> "$GITHUB_OUTPUT"

  refresh-mec:
    needs: lease-gate
    if: needs.lease-gate.outputs.acquired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python tools/fetch_camoufox.py

      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

      - name: Verify MEC fallback browser runtime
        run: python tools/check_mec_browser_runtime.py

      - name: Hydrate current production dealer seed
        run: python tools/hydrate_runtime_snapshot.py --site-url "$SITE_URL" --dataset dealers --output dealers/results.json

      - name: Refresh MEC scrape and sync
        run: |
          mkdir -p dealers/_partial
          rm -f dealers/_partial/*.json
          timeout 3600 python -u -m dealers.mec
          python tools/check_mec_partial.py
          python -m dealers.merge_partial
          python -u -m dealers.supabase_sync
          echo "SYNC_COMPLETED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          python tools/check_data_quality.py --online --dealer mec --max-age-hours 36 --max-product-age-hours 72 --min-rows 50

      - name: Verify production freshness
        run: |
          python tools/wait_for_data_release.py --site-url "$SITE_URL" --after "$SYNC_COMPLETED_AT" --timeout-seconds 1800 --interval-seconds 10
          python tools/check_data_quality.py --online --dealer mec --max-age-hours 36 --max-product-age-hours 72 --min-rows 50
          python tools/notify_indexnow.py --sitemap-url "$SITE_URL/sitemap-products.xml" --sitemap-url "$SITE_URL/sitemap-deals.xml" --sitemap-url "$SITE_URL/sitemap-insights.xml" --since-days 2 || echo "::warning::IndexNow notification failed or is not configured"

      - name: Release MEC lease
        if: always() && needs.lease-gate.outputs.lease_owned == 'true'
        env:
          LEASE_OWNER: ${{ needs.lease-gate.outputs.owner }}
          JOB_STATUS: ${{ job.status }}
        run: |
          python -m pip install 'requests>=2.32,<3' >/dev/null
          status=failed
          [ "$JOB_STATUS" = "success" ] && status=success
          python tools/crawler_lease.py finish --scope mec --owner "$LEASE_OWNER" --status "$status" --message "GitHub Actions run ${GITHUB_RUN_ID}: $JOB_STATUS"
