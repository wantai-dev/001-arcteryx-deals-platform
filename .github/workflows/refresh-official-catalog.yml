name: Refresh Official Yearbook Catalog

on:
  schedule:
    - cron: "40 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geardrop-official-yearbook-sync
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

jobs:
  refresh-official-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"
      - id: lease
        name: Claim official catalog lease
        run: |
          owner="github-actions-official-catalog-${GITHUB_RUN_ID}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          acquired=$(python tools/crawler_lease.py acquire --scope official-catalog --owner "$owner" --ttl-minutes 150)
          if [ "$acquired" != "true" ]; then
            echo "Another official catalog sync owns the lease."
            exit 1
          fi
          echo "acquired=true" >> "$GITHUB_OUTPUT"
      - name: Collect complete catalog and sync
        run: |
          echo "CATALOG_SYNC_STARTED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
          timeout 7200 python -u -m catalog.official_catalog --state "$RUNNER_TEMP/catalog_state.json" --sync-supabase
      - name: Independently read back public catalog
        run: python tools/check_official_catalog.py --expected-state "$RUNNER_TEMP/catalog_state.json" --after "$CATALOG_SYNC_STARTED_AT"
      - name: Release official catalog lease
        if: always() && steps.lease.outputs.acquired == 'true'
        env:
          LEASE_OWNER: ${{ steps.lease.outputs.owner }}
          JOB_STATUS: ${{ job.status }}
        run: |
          status=failed
          [ "$JOB_STATUS" = "success" ] && status=success
          python tools/crawler_lease.py finish --scope official-catalog --owner "$LEASE_OWNER" --status "$status" --message "GitHub Actions run ${GITHUB_RUN_ID}: $JOB_STATUS"
