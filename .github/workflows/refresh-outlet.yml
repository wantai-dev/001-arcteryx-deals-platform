name: Refresh Outlet Data

on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even when the primary node is healthy"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: arcteryx-production-refresh-writes
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
  INDEXNOW_KEY_LOCATION: ${{ secrets.INDEXNOW_KEY_LOCATION }}
  GITHUB_TOKEN: ${{ github.token }}
  SITE_URL: https://geardrop.100app.dev

jobs:
  lease-gate:
    runs-on: ubuntu-latest
    outputs:
      acquired: ${{ steps.lease.outputs.acquired }}
      owner: ${{ steps.lease.outputs.owner }}
      lease_owned: ${{ steps.lease.outputs.lease_owned }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'requests>=2.32,<3'
      - id: lease
        name: Claim Outlet fallback lease when needed
        env:
          FORCE_RUN: ${{ inputs.force || 'false' }}
        run: |
          owner="github-actions-outlet-${GITHUB_RUN_ID}"
          should_run="$FORCE_RUN"
          lease_owned=false
          if [ "$should_run" != "true" ]; then
            should_run=$(python tools/crawler_lease.py needs-fallback --scope outlet --stale-hours 4.5)
          fi
          acquired=false
          if [ "$should_run" = "true" ]; then
            if [ "$FORCE_RUN" = "true" ]; then
              acquired=true
            else
              acquired=$(python tools/crawler_lease.py acquire --scope outlet --owner "$owner" --ttl-minutes 240)
              if [ "$acquired" = "true" ]; then
                lease_owned=true
              fi
            fi
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "acquired=$acquired" >> "$GITHUB_OUTPUT"
          echo "lease_owned=$lease_owned" >> "$GITHUB_OUTPUT"

  refresh-outlet:
    needs: lease-gate
    if: needs.lease-gate.outputs.acquired == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python tools/fetch_camoufox.py

      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

      - name: Verify lifecycle safety rules
        run: python -m unittest discover -s tests -v

      - name: Hydrate current production catalog seed
        run: python tools/hydrate_runtime_snapshot.py --site-url "$SITE_URL" --dataset catalog --output global_data.json

      - name: Refresh Outlet scrape and sync
        run: |
          date -u '+%Y-%m-%d %H:%M:%S' > .last_run_start
          python -u global_scraper.py --redirect-timeout 3 --redirect-workers 50
          python -u sku_scraper.py --reset --update-data
          python -u supabase_sync.py
          python -u tools/check_product_urls.py --status active --stored-http-status 404 --stored-http-status 410 --max-rows 500
          python -u tools/check_product_urls.py --status missing --max-rows 500
          python tools/check_data_quality.py --online --dealer arcteryx_outlet --max-age-hours 36 --max-product-age-hours 72 --min-rows 100 --forbid-region jp
          echo "SYNC_COMPLETED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Optional notifications
        run: |
          python check_price_alerts.py || echo "price alerts check failed"
          python notify_telegram.py || echo "telegram notification failed"

      - name: Verify production freshness
        run: |
          python tools/wait_for_data_release.py --site-url "$SITE_URL" --after "$SYNC_COMPLETED_AT" --timeout-seconds 1800 --interval-seconds 10
          python tools/check_data_quality.py --online --dealer arcteryx_outlet --max-age-hours 36 --max-product-age-hours 72 --min-rows 100 --forbid-region jp
          curl -fsS "$SITE_URL/api/catalog?region=us&limit=1" | python -c 'import json,sys; value=json.load(sys.stdin); assert value["rows"] and value["data_revision"]; print("catalog_revision", value["data_revision"])'
          python tools/notify_indexnow.py --sitemap-url "$SITE_URL/sitemap-products.xml" --sitemap-url "$SITE_URL/sitemap-deals.xml" --sitemap-url "$SITE_URL/sitemap-insights.xml" --since-days 2 || echo "::warning::IndexNow notification failed or is not configured"

      - name: Release Outlet lease
        if: always() && needs.lease-gate.outputs.lease_owned == 'true'
        env:
          LEASE_OWNER: ${{ needs.lease-gate.outputs.owner }}
          JOB_STATUS: ${{ job.status }}
        run: |
          status=failed
          [ "$JOB_STATUS" = "success" ] && status=success
          python tools/crawler_lease.py finish --scope outlet --owner "$LEASE_OWNER" --status "$status" --message "GitHub Actions run ${GITHUB_RUN_ID}: $JOB_STATUS"
