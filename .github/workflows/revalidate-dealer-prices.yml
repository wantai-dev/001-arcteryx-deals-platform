name: Revalidate Dealer Prices

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      repair_only:
        description: "Only repair derived dealer discount fields and run quality checks"
        required: false
        type: boolean
        default: false
      dealers:
        description: "Comma-separated revalidation subset on GitHub-hosted egress: evo,mec"
        required: false
        type: string
        default: "evo,mec"
      sku_ids:
        description: "Optional comma-separated exact SKU allowlist (maximum 100)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: arcteryx-production-refresh-writes
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
  GITHUB_TOKEN: ${{ github.token }}
  REI_BROWSER_ROTATE_ROWS: "5"
  REVALIDATE_DEALERS: ${{ github.event_name == 'schedule' && 'evo,mec' || inputs.dealers }}
  REVALIDATE_SKU_IDS: ${{ inputs.sku_ids }}
  REVALIDATE_MAX_ROWS_PER_DEALER: ${{ github.event_name == 'schedule' && '50' || '' }}

jobs:
  revalidate-dealer-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      revalidate_outcome: ${{ steps.revalidate.outcome }}

    steps:
      - uses: actions/checkout@v4

      - name: Reject unsupported dealer egress
        env:
          REQUESTED_DEALERS: ${{ github.event_name == 'schedule' && 'evo,mec' || inputs.dealers }}
        run: |
          test -n "$REQUESTED_DEALERS"
          IFS=',' read -ra requested_dealers <<< "$REQUESTED_DEALERS"
          for dealer in "${requested_dealers[@]}"; do
            case "$dealer" in
              evo|mec) ;;
              rei)
                echo "::error::REI PDP access is unavailable from GitHub-hosted egress. Use the lease-protected direct-server server_run_revalidate.sh path."
                exit 1
                ;;
              *)
                echo "::error::Unsupported dealer for this workflow: $dealer"
                exit 1
                ;;
            esac
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          python tools/fetch_camoufox.py

      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_KEY"

      - name: Verify MEC fallback browser runtime
        run: python tools/check_mec_browser_runtime.py

      - name: Repair derived dealer discounts
        run: |
          python tools/repair_dealer_discounts.py --dealer mec --dealer evo

      - id: revalidate
        name: Revalidate known dealer URLs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.repair_only != true }}
        run: python -u -m dealers.revalidate

      - name: Verify dealer data quality
        if: ${{ inputs.repair_only == true || steps.revalidate.outcome == 'success' }}
        run: |
          python tools/check_data_quality.py --online --dealer mec --dealer evo --dealer rei --max-age-hours 36 --max-product-age-hours 72 --min-rows 50
