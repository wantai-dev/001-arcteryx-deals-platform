root /srv/geardrop/current/static;
index index.html;
charset utf-8;
etag on;
client_max_body_size 1m;
gzip_static on;
gzip_vary on;
add_header Strict-Transport-Security "max-age=86400" always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://bupqagkrcvrezjkdbald.supabase.co; img-src 'self' data: https:; font-src 'self' data:; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location = /p {
    proxy_pass http://127.0.0.1:4181;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 12s;
    proxy_send_timeout 12s;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
}

location = /api/catalog {
    proxy_pass http://127.0.0.1:4181;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_send_timeout 12s;
    proxy_hide_header X-Powered-By;
    proxy_hide_header X-Content-Type-Options;
}

location = /data-status.json {
    alias /srv/geardrop/data/status.json;
    default_type application/json;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://bupqagkrcvrezjkdbald.supabase.co; img-src 'self' data: https:; font-src 'self' data:; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Data snapshots are built from Supabase into an immutable release and exposed
# through one atomic symlink. They never need to enter the code release or Git.
location ~ ^/(?:data\.js|global_data\.json|publication\.json|data-manifest\.json|catalog-status\.(?:html|json)|sitemap-(?:products|deals|insights)\.xml|h5/data\.js|dealers/results\.json|brands/(?:arcteryx|burton|patagonia)(?:/page/[1-9][0-9]*)?\.html|categories/(?:pants|footwear|fleece|jackets|insulated-jackets)(?:/page/[1-9][0-9]*)?\.html|insights/(?:catalog-coverage|brand-source-matrix|regional-coverage)\.html|en/catalog-status\.html|en/brands/(?:arcteryx|burton|patagonia)(?:/page/[1-9][0-9]*)?\.html|en/categories/(?:pants|footwear|fleece|jackets|insulated-jackets)(?:/page/[1-9][0-9]*)?\.html|en/insights/(?:catalog-coverage|brand-source-matrix|regional-coverage)\.html)$ {
    root /srv/geardrop/data/current/public;
    try_files $uri =503;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://bupqagkrcvrezjkdbald.supabase.co; img-src 'self' data: https:; font-src 'self' data:; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

location ~ /\. {
    deny all;
}

location / {
    try_files $uri $uri/ =404;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://bupqagkrcvrezjkdbald.supabase.co; img-src 'self' data: https:; font-src 'self' data:; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
